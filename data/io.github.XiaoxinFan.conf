<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- 只有 root（守护进程）能占用这个名字 -->
  <policy user="root">
    <allow own="io.github.XiaoxinFan"/>
    <allow send_destination="io.github.XiaoxinFan"/>
  </policy>

  <!-- 所有用户可以读取状态 -->
  <policy context="default">
    <allow send_destination="io.github.XiaoxinFan" send_interface="io.github.XiaoxinFan1" send_member="GetStatus"/>
    <allow send_destination="io.github.XiaoxinFan" send_interface="io.github.XiaoxinFan1" send_member="ListPresets"/>
    <allow send_destination="io.github.XiaoxinFan" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.XiaoxinFan" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>

  <!-- 管理员组（sudo）可以切换预设 -->
  <policy group="sudo">
    <allow send_destination="io.github.XiaoxinFan" send_interface="io.github.XiaoxinFan1" send_member="SetPreset"/>
  </policy>
</busconfig>
